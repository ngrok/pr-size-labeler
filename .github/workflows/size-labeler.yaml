# Use our own size labeler action to label our own PRs with the size of the PR.
name: Size Labeler
on: [pull_request]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labeler:
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Labeler action
      uses: ./.
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
